<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receipt Scanner</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #fff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e3e1db;
    --accent: #1f6f5c; --accent-ink: #fff; --warn: #a64b2a; --pending: #8a6d1d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --card: #20201e; --ink: #ecebe6; --muted: #9c9a93; --line: #34332f;
      --accent: #3fa58a; --accent-ink: #0d1512; --warn: #e0835f; --pending: #d6b453;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0; }
  header a { color: var(--muted); font-size: 13px; }

  .add { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .add.busy { opacity: .6; pointer-events: none; }
  .capture { display: block; padding: 22px 12px; border: 2px dashed var(--accent); border-radius: 14px;
             background: transparent; color: var(--accent); font-size: 17px; font-weight: 600; cursor: pointer;
             text-align: center; }
  .capture.primary { background: var(--accent); color: var(--accent-ink); border-style: solid; }
  .capture input { display: none; }
  .drop-hint { margin: 6px 2px 0; font-size: 12px; color: var(--muted); text-align: center; }
  body.dragging main::after { content: "Drop photos to upload"; position: fixed; inset: 12px; z-index: 20;
             display: grid; place-items: center; border: 3px dashed var(--accent); border-radius: 18px;
             background: color-mix(in srgb, var(--bg) 85%, transparent); color: var(--accent);
             font-size: 22px; font-weight: 600; pointer-events: none; }
  @media (hover: none) { .drop-hint { display: none; } }  /* touch devices can't drag files in */
  #msg { min-height: 1.4em; margin: 8px 2px 16px; color: var(--warn); font-size: 14px; }

  .receipt { display: grid; grid-template-columns: 110px 1fr; gap: 14px; background: var(--card);
             border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
  .thumb { width: 110px; height: 150px; object-fit: cover; object-position: top; border-radius: 6px;
           border: 1px solid var(--line); background: var(--line); cursor: zoom-in; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; align-content: start; }
  .fields label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 2px; }
  .fields label.wide { grid-column: 1 / -1; }
  .money { display: flex; }
  .money input[name=total] { border-radius: 6px 0 0 6px; }
  .money .cur { flex: none; width: 3.8em; border-left: 0; border-radius: 0 6px 6px 0; text-align: center;
                text-transform: uppercase; font-size: 12px; color: var(--muted); }
  .fields input { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line);
                  border-radius: 6px; padding: 6px 8px; width: 100%; min-width: 0; }
  .fields input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; color: var(--muted); }
  .status { font-weight: 600; }
  .status.pending { color: var(--pending); }
  .status.error { color: var(--warn); }
  .status.done { color: var(--accent); }
  .err { grid-column: 1 / -1; color: var(--warn); font-size: 12px; overflow-wrap: anywhere; }
  .actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
  .actions button { font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 6px; cursor: pointer;
                    border: 1px solid var(--line); background: transparent; color: var(--ink); }
  .actions button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .actions button.danger { color: var(--warn); }
  .actions button:disabled { opacity: .5; cursor: default; }
  .note { align-self: center; font-size: 12px; margin-left: 2px; }
  .note.dirty { color: var(--pending); }
  .note.saved { color: var(--accent); font-weight: 600; }
  .note.failed { color: var(--warn); }
  .receipt.dirty { border-color: var(--pending); box-shadow: inset 4px 0 0 var(--pending); }
  .fields input.changed { border-color: var(--pending); background: color-mix(in srgb, var(--pending) 8%, transparent); }
  .receipt.just-saved { animation: saved 1.8s ease-out; }
  @keyframes saved {
    from { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 45%, transparent); }
    to { border-color: var(--line); box-shadow: 0 0 0 3px transparent; }
  }
  .upload { display: none; margin-top: 10px; background: var(--card); border: 1px solid var(--line);
            border-radius: 10px; padding: 10px 12px; font-size: 14px; }
  .upload.active { display: block; }
  .upload-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .upload button { font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 6px; cursor: pointer;
                   border: 1px solid var(--line); background: transparent; color: var(--ink); }
  .bar { height: 6px; background: var(--line); border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .bar.indeterminate > div { width: 30%; animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { from { margin-left: -30%; } to { margin-left: 100%; } }
  .conn { display: none; margin: 0 0 12px; padding: 8px 12px; border-radius: 8px; font-size: 14px;
          background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
  .conn.show { display: block; }
  .slow { color: var(--warn); }
  .tags { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 4px; font: inherit; font-size: 13px; line-height: 1;
          padding: 5px 8px; border-radius: 999px; border: 1px solid var(--accent); color: var(--accent);
          background: color-mix(in srgb, var(--accent) 10%, transparent); cursor: pointer; }
  .chip .x { opacity: .7; }
  .tag-entry { position: relative; flex: 1 1 120px; min-width: 120px; }
  .tag-entry input { width: 100%; font: inherit; font-size: 13px; color: var(--ink); background: transparent;
                     border: 1px dashed var(--line); border-radius: 999px; padding: 5px 10px; }
  .tag-entry input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-style: solid; }
  .suggest { display: none; position: absolute; z-index: 5; top: calc(100% + 4px); left: 0; right: 0;
             min-width: 180px; background: var(--card); border: 1px solid var(--line); border-radius: 8px;
             box-shadow: 0 6px 18px rgb(0 0 0 / .15); padding: 4px; max-height: 240px; overflow-y: auto; }
  .suggest.open { display: block; }
  .suggest button { display: flex; justify-content: space-between; width: 100%; text-align: left; font: inherit;
                    font-size: 14px; padding: 7px 8px; border: 0; border-radius: 6px; background: transparent;
                    color: var(--ink); cursor: pointer; }
  .suggest button.active, .suggest button:hover { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .suggest .count { color: var(--muted); font-size: 12px; }
  .lightbox { width: 100vw; height: 100dvh; max-width: none; max-height: none; margin: 0; padding: 0;
              border: 0; background: #111; color: #eee; }
  .lightbox::backdrop { background: rgb(0 0 0 / .6); }
  .lightbox[open] { display: flex; flex-direction: column; }
  .lb-bar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; font-size: 14px; }
  .lb-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-bar button, .lb-bar a { font: inherit; font-size: 14px; color: #eee; background: rgb(255 255 255 / .12);
                              border: 0; border-radius: 6px; padding: 6px 10px; cursor: pointer; text-decoration: none; }
  .lb-bar .lb-close { font-size: 18px; line-height: 1; padding: 6px 11px; }
  /* flex + margin:auto centres the image when it fits and still lets every edge scroll into view when zoomed */
  .lb-body { flex: 1; min-height: 0; overflow: auto; display: flex; padding: 0 16px 16px; }
  .lb-body img { margin: auto; max-width: 100%; max-height: 100%; object-fit: contain; cursor: zoom-in; }
  .lb-body.zoomed img { max-width: none; max-height: none; cursor: zoom-out; }
  html:has(.lightbox[open]) { overflow: hidden; }  /* don't scroll the page behind the viewer */
  .empty { text-align: center; color: var(--muted); padding: 32px 0; }
  .empty button, .filter .clear { font: inherit; font-size: 13px; color: var(--accent); background: transparent;
                                  border: 0; padding: 4px 6px; cursor: pointer; text-decoration: underline; }
  .filter { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 2px 12px; font-size: 13px; }
  .filter[hidden] { display: none; }
  .filter .label { color: var(--muted); margin-right: 2px; }
  .fchip { font: inherit; font-size: 13px; line-height: 1; padding: 5px 9px; border-radius: 999px; cursor: pointer;
           border: 1px solid var(--line); background: transparent; color: var(--ink); }
  .fchip .count { color: var(--muted); font-size: 12px; margin-left: 4px; }
  .fchip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .fchip.on .count { color: inherit; opacity: .8; }
  .fchip.untagged { font-style: italic; }
  .total { margin: 0 2px 12px; color: var(--muted); font-size: 13px; }

  @media (max-width: 420px) {
    .receipt { grid-template-columns: 84px 1fr; }
    .thumb { width: 84px; height: 116px; }
    .fields { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Receipt Scanner</h1>
    <a href="/api/receipts.csv" id="csvLink">Export CSV</a>
  </header>

  <div class="add" id="addBtns">
    <label class="capture primary">
      📷 Take photo
      <input type="file" id="cameraInput" accept="image/*" capture="environment">
    </label>
    <label class="capture">
      🖼️ Upload photo
      <input type="file" id="fileInput" accept="image/*,.heic,.heif" multiple>
    </label>
  </div>
  <p class="drop-hint">…or drag photos onto this page</p>
  <div class="upload" id="upload">
    <div class="upload-row"><span id="uploadLabel"></span><button id="cancelBtn" type="button">Cancel</button></div>
    <div class="bar" id="bar"><div id="barFill"></div></div>
  </div>
  <div id="msg"></div>
  <div class="conn" id="conn"></div>

  <div class="filter" id="filter" hidden></div>
  <div class="total" id="summary"></div>
  <div id="list"></div>
</main>

<dialog class="lightbox" id="lightbox" aria-label="Receipt image">
  <div class="lb-bar">
    <span class="lb-title"></span>
    <button type="button" class="lb-alt"></button>
    <a class="lb-open" target="_blank" rel="noopener">Open in new tab</a>
    <button type="button" class="lb-close" aria-label="Close">✕</button>
  </div>
  <div class="lb-body"><img alt="receipt"></div>
</dialog>

<template id="tpl">
  <div class="receipt">
    <a class="thumb-link" target="_blank" rel="noopener"><img class="thumb" alt="receipt" loading="lazy" decoding="async"></a>
    <div class="fields">
      <label class="wide">Vendor <input name="vendor" autocomplete="off"></label>
      <label class="wide">Description <input name="description" autocomplete="off" placeholder="e.g. various hardware"></label>
      <label>Date <input name="receipt_date" type="date"></label>
      <label>Total
        <span class="money">
          <input name="total" inputmode="decimal" autocomplete="off">
          <input name="currency" class="cur" maxlength="3" autocomplete="off" placeholder="cur"
                 aria-label="Currency" title="Currency (e.g. USD)">
        </span>
      </label>
      <div class="tags"><span class="chips"></span>
        <div class="tag-entry">
          <input class="tag-input" placeholder="+ tag" autocomplete="off" autocapitalize="none" enterkeyhint="done" maxlength="40">
          <div class="suggest"></div>
        </div>
      </div>
      <div class="meta"><span class="status"></span><span class="crop"></span><span class="extractor"></span><span class="created"></span></div>
      <div class="err"></div>
      <div class="actions">
        <button class="primary save" disabled>Save</button>
        <button class="revert" disabled title="Undo unsaved changes">Revert</button>
        <button class="toggle"></button>
        <button class="rotate">Rotate ↻</button>
        <button class="recrop">Re-crop</button>
        <button class="reextract">Re-extract</button>
        <button class="danger delete">Delete</button>
        <span class="note" aria-live="polite"></span>
      </div>
    </div>
  </div>
</template>

<script>
const $ = (s, el = document) => el.querySelector(s);
const list = $("#list"), msg = $("#msg"), tpl = $("#tpl"), conn = $("#conn");

const API_TIMEOUT_MS = 20000;      // ordinary API calls
const UPLOAD_TIMEOUT_MS = 180000;  // whole upload incl. server-side image processing
const SLOW_EXTRACT_S = 180;        // matches the server's STALE_AFTER_S, when Re-extract is allowed again
const MAX_UPLOAD_EDGE = 2400;      // server keeps 1600px anyway; shrinking first makes uploads fast

let pollTimer = null, pollDelay = 1500, clockOffset = 0;  // clockOffset = server time - local time
let allTags = [];        // [{name, count}], most-used first; feeds tag suggestions
let refocusTagFor = null;  // receipt id whose tag input should keep focus after a re-render
let savedFlashFor = null;  // receipt id whose card should show "Saved" after the next render
let lastReceipts = null; // latest list from the server, so filter changes re-render without a fetch

function netError(e) {
  if (e.name === "TimeoutError" || e.name === "AbortError") return new Error("the server took too long to answer");
  if (e instanceof TypeError) return new Error("can't reach the server (is it running, and are you on the same network?)");
  return e;
}

async function api(path, opts = {}) {
  let r;
  try { r = await fetch(path, {signal: AbortSignal.timeout(API_TIMEOUT_MS), ...opts}); }
  catch (e) { throw netError(e); }
  if (!r.ok) {
    let detail = `${r.status} ${r.statusText}`;
    try { detail = (await r.json()).detail || detail; } catch {}
    throw new Error(detail);
  }
  return r.status === 204 ? null : r.json();
}

function centsToStr(c) { return c == null ? "" : (c / 100).toFixed(2); }
function strToCents(s) {
  s = s.trim().replace(",", ".");
  if (!s) return null;
  const n = Number(s);
  if (!isFinite(n)) throw new Error(`"${s}" is not a number`);
  return Math.round(n * 100);
}
function fmtBytes(n) { return n < 1e6 ? `${Math.round(n / 1e3)} KB` : `${(n / 1e6).toFixed(1)} MB`; }
function fmtSecs(s) { return s < 60 ? `${s}s` : `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, "0")}s`; }

// ---------- receipt list ----------

const rendered = new Map();  // id -> {json, el}; unchanged cards are kept so in-progress edits survive polling

function render(receipts) {
  const next = [];
  for (const r of receipts) {
    const json = JSON.stringify(r), prev = rendered.get(r.id);
    let el = prev && prev.json === json ? prev.el : card(r);
    if (prev && el !== prev.el) el.restoreEdits(prev.el.unsavedEdits());  // e.g. a tag was added mid-edit
    rendered.set(r.id, {json, el});
    next.push(el);
  }
  const ids = new Set(receipts.map(r => r.id));
  for (const id of rendered.keys()) if (!ids.has(id)) rendered.delete(id);
  list.replaceChildren(...next);
  const visible = receipts.filter(matchesFilter);
  for (const r of receipts) rendered.get(r.id).el.hidden = !matchesFilter(r);
  if (savedFlashFor != null) {
    const el = rendered.get(savedFlashFor)?.el;
    savedFlashFor = null;
    if (el) el.showSaved();
  }
  if (refocusTagFor != null) {
    const input = rendered.get(refocusTagFor) && $(".tag-input", rendered.get(refocusTagFor).el);
    refocusTagFor = null;
    input?.focus();
  }
  if (!receipts.length) list.innerHTML = `<div class="empty">No receipts yet.</div>`;
  else if (!visible.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.innerHTML = `No receipts match this filter. <button type="button">Show all</button>`;
    $("button", empty).onclick = () => setFilter([], false);
    list.append(empty);
  }

  const byCur = {};
  for (const r of visible) if (r.total_cents != null) {
    const c = r.currency || "";
    byCur[c] = (byCur[c] || 0) + r.total_cents;
  }
  const parts = Object.entries(byCur).map(([c, v]) => `${centsToStr(v)} ${c}`.trim());
  const count = filterActive() ? `${visible.length} of ${receipts.length}` : `${receipts.length}`;
  $("#summary").textContent = visible.length
    ? `${count} receipt${receipts.length === 1 ? "" : "s"}` + (parts.length ? ` · total ${parts.join(" + ")}` : "")
    : "";
  drawFilter();
  tickElapsed();
}

function card(r) {
  const el = tpl.content.firstElementChild.cloneNode(true);
  const showScan = r.use_scan && r.scan_url;
  const src = showScan ? r.scan_url : r.original_url;
  $(".thumb", el).src = showScan ? r.scan_thumb_url : r.original_thumb_url;
  $(".thumb-link", el).href = src;
  $(".thumb-link", el).onclick = e => {
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;  // let modified clicks open a tab
    e.preventDefault();
    openLightbox(r, showScan ? "scan" : "original");
  };

  const f = name => $(`input[name=${name}]`, el);
  f("vendor").value = r.vendor ?? "";
  f("description").value = r.description ?? "";
  f("receipt_date").value = r.receipt_date ?? "";
  f("total").value = centsToStr(r.total_cents);
  f("currency").value = r.currency ?? "";

  // Unsaved-change tracking: compare what's typed with what's stored, after the same clean-up Save does
  // (so "4.4" vs "4.40" or "usd" vs "USD" don't count as changes).
  const save = $(".save", el), note = $(".note", el);
  const stored = Object.fromEntries(EDIT_FIELDS.map(n => [n, f(n).value]));  // as shown when the card was built
  const original = Object.fromEntries(EDIT_FIELDS.map(n => [n, normalise(n, stored[n])]));
  const revert = $(".revert", el);
  let noteTimer = null;
  function setNote(text, kind = "") {
    clearTimeout(noteTimer);
    note.textContent = text;
    note.className = `note ${kind}`;
  }
  function checkDirty() {
    let dirty = false;
    for (const n of EDIT_FIELDS) {
      const changed = normalise(n, f(n).value) !== original[n];
      f(n).classList.toggle("changed", changed);
      dirty ||= changed;
    }
    el.classList.toggle("dirty", dirty);
    save.disabled = revert.disabled = !dirty;
    if (dirty) setNote("Unsaved changes", "dirty");
    else if (note.classList.contains("dirty")) setNote("");
    return dirty;
  }
  for (const n of EDIT_FIELDS) f(n).addEventListener("input", checkDirty);
  revert.onclick = () => {
    for (const n of EDIT_FIELDS) f(n).value = stored[n];
    checkDirty();
    setNote("");
  };
  el.unsavedEdits = () => Object.fromEntries(EDIT_FIELDS.filter(n => f(n).classList.contains("changed")).map(n => [n, f(n).value]));
  el.restoreEdits = edits => {
    for (const [n, v] of Object.entries(edits)) f(n).value = v;
    checkDirty();
  };
  el.showSaved = () => {
    el.classList.remove("just-saved");
    void el.offsetWidth;  // restart the animation if it's still running
    el.classList.add("just-saved");
    setNote("✓ Saved", "saved");
    noteTimer = setTimeout(() => setNote(""), 2500);
  };

  const st = $(".status", el);
  st.classList.add(r.status);
  if (r.status === "pending") {
    st.textContent = "extracting…";
    if (r.extract_started_at) el.dataset.started = r.extract_started_at;
  } else {
    st.textContent = r.status;
  }
  $(".extractor", el).textContent = r.extractor || "";
  $(".created", el).textContent = new Date(r.created_at).toLocaleString();
  $(".err", el).textContent = r.error || "";
  if (!r.error) $(".err", el).remove();

  const toggle = $(".toggle", el);
  if (r.scan_url) {
    toggle.textContent = showScan ? "Use uncropped" : "Use cropped";
    toggle.onclick = () => act(() => api(`/api/receipts/${r.id}`, {
      method: "PATCH", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({use_scan: !showScan}),
    }));
  } else {
    toggle.remove();  // no receipt edge was found, only the original exists
  }
  $(".crop", el).textContent = r.scan_url
    ? (showScan ? "cropped & straightened" : "showing uncropped")
    : "not cropped: receipt edge not found";
  setupTags(el, r);
  $(".rotate", el).onclick = () => act(() => api(`/api/receipts/${r.id}/rotate`, {method: "POST"}));
  $(".recrop", el).onclick = () => act(() => api(`/api/receipts/${r.id}/recrop`, {method: "POST"}), "Re-cropped.");

  save.onclick = async () => {
    save.disabled = revert.disabled = true;
    save.textContent = "Saving…";
    try {
      await api(`/api/receipts/${r.id}`, {
        method: "PATCH", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          vendor: f("vendor").value.trim() || null,
          description: f("description").value.trim() || null,
          receipt_date: f("receipt_date").value || null,
          total_cents: strToCents(f("total").value),
          currency: f("currency").value.trim().toUpperCase() || null,
        }),
      });
    } catch (e) {
      save.textContent = "Save";
      checkDirty();  // also re-enables Revert
      setNote(`Not saved: ${e.message}`, "failed");
      return;
    }
    savedFlashFor = r.id;
    await load();  // rebuilds the card from the saved row, which then shows "Saved"
  };
  // Enter in a text field saves, like a form would.
  for (const n of EDIT_FIELDS) f(n).addEventListener("keydown", e => {
    if (e.key === "Enter" && !save.disabled) { e.preventDefault(); save.click(); }
  });
  $(".reextract", el).onclick = () => act(() => api(`/api/receipts/${r.id}/extract`, {method: "POST"}));
  $(".delete", el).onclick = () => {
    if (el.dataset.confirm) return act(() => api(`/api/receipts/${r.id}`, {method: "DELETE"}));
    el.dataset.confirm = "1";
    $(".delete", el).textContent = "Really delete?";
    setTimeout(() => { delete el.dataset.confirm; $(".delete", el).textContent = "Delete"; }, 3000);
  };
  return el;
}

const EDIT_FIELDS = ["vendor", "description", "receipt_date", "total", "currency"];

function normalise(name, value) {
  value = value.trim();
  if (name === "currency") return value.toUpperCase();
  if (name === "total") { try { return String(strToCents(value)); } catch { return `invalid:${value}`; } }
  return value;
}

window.addEventListener("beforeunload", e => {
  if (list.querySelector(".receipt.dirty")) e.preventDefault();  // browser asks "leave site?"
});

// Update "extracting… 12s" labels in place, so polling doesn't rebuild cards every second.
function tickElapsed() {
  const now = Date.now() + clockOffset;
  for (const el of list.querySelectorAll("[data-started]")) {
    const secs = Math.max(0, Math.round((now - Date.parse(el.dataset.started)) / 1000));
    const st = $(".status", el);
    st.textContent = `extracting… ${fmtSecs(secs)}`;
    if (secs > SLOW_EXTRACT_S) {
      st.textContent += " (unusually slow; try Re-extract)";
      st.classList.add("slow");
    }
  }
}
setInterval(tickElapsed, 1000);

// ---------- tag filter ----------
// Selecting several tags shows receipts that have all of them; "untagged" shows receipts with none.
// The filter lives in the page URL (?tag=a&tag=b or ?untagged=1), so reloads and bookmarks keep it.

let filterTags = [], filterUntagged = false;
{
  const q = new URLSearchParams(location.search);
  filterTags = q.getAll("tag").filter(Boolean);
  filterUntagged = q.has("untagged") && !filterTags.length;
}

const filterActive = () => filterUntagged || filterTags.length > 0;

function matchesFilter(r) {
  if (filterUntagged) return r.tags.length === 0;
  const have = new Set(r.tags.map(t => t.toLowerCase()));
  return filterTags.every(t => have.has(t.toLowerCase()));
}

function setFilter(tags, untagged) {
  filterTags = tags;
  filterUntagged = untagged;
  const q = new URLSearchParams();
  for (const t of tags) q.append("tag", t);
  if (untagged) q.set("untagged", "1");
  const qs = q.toString() ? `?${q}` : "";
  history.replaceState(null, "", location.pathname + qs);
  $("#csvLink").href = `/api/receipts.csv${qs}`;  // export what's on screen
  if (lastReceipts) render(lastReceipts);
}

function drawFilter() {
  const bar = $("#filter");
  const on = new Set(filterTags.map(t => t.toLowerCase()));
  // A selected tag can stop existing (removed from its last receipt); keep its chip so the filter stays visible.
  const tags = [...allTags];
  for (const t of filterTags) if (!tags.some(a => a.name.toLowerCase() === t.toLowerCase())) tags.push({name: t, count: 0});
  const chip = (label, count, selected, onclick) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "fchip" + (selected ? " on" : "");
    b.setAttribute("aria-pressed", selected);
    b.innerHTML = `<span></span><span class="count"></span>`;
    b.firstChild.textContent = label;
    b.lastChild.textContent = count;
    b.onclick = onclick;
    return b;
  };
  const items = tags.map(t => chip(t.name, t.count, on.has(t.name.toLowerCase()), () =>
    setFilter(on.has(t.name.toLowerCase()) ? filterTags.filter(x => x.toLowerCase() !== t.name.toLowerCase())
                                           : [...filterTags, t.name], false)));
  const untaggedCount = (lastReceipts || []).filter(r => !r.tags.length).length;
  if (untaggedCount || filterUntagged) {
    const u = chip("untagged", untaggedCount, filterUntagged, () => setFilter([], !filterUntagged));
    u.classList.add("untagged");
    items.push(u);
  }
  if (filterActive()) {
    const clear = document.createElement("button");
    clear.type = "button";
    clear.className = "clear";
    clear.textContent = "Clear";
    clear.onclick = () => setFilter([], false);
    items.push(clear);
  }
  const label = document.createElement("span");
  label.className = "label";
  label.textContent = "Filter:";
  bar.replaceChildren(label, ...items);
  bar.hidden = !tags.length && !filterActive();  // nothing to filter by until some receipt has a tag
}

// ---------- image viewer ----------

const lb = $("#lightbox"), lbBody = $(".lb-body", lb), lbImg = $(".lb-body img", lb);

function openLightbox(r, kind) {
  const url = kind === "scan" ? r.scan_url : r.original_url;
  lbBody.classList.remove("zoomed");
  lbImg.src = url;
  $(".lb-open", lb).href = url;
  $(".lb-title", lb).textContent = [r.vendor, r.receipt_date].filter(Boolean).join(" · ") || "Receipt";
  const alt = $(".lb-alt", lb);
  alt.hidden = !r.scan_url;
  alt.textContent = kind === "scan" ? "Show uncropped" : "Show cropped";
  alt.onclick = () => openLightbox(r, kind === "scan" ? "original" : "scan");
  if (!lb.open) lb.showModal();
}

// Tap the image to toggle fit-to-screen / full resolution, keeping the tapped spot in view.
lbImg.addEventListener("click", e => {
  const rect = lbImg.getBoundingClientRect();
  const fx = (e.clientX - rect.left) / rect.width, fy = (e.clientY - rect.top) / rect.height;
  const zoomed = lbBody.classList.toggle("zoomed");
  if (zoomed) {
    lbBody.scrollLeft = fx * lbImg.offsetWidth - lbBody.clientWidth / 2;
    lbBody.scrollTop = fy * lbImg.offsetHeight - lbBody.clientHeight / 2;
  }
});
lbBody.addEventListener("click", e => { if (e.target === lbBody) lb.close(); });  // tap outside the image
$(".lb-close", lb).onclick = () => lb.close();
lb.addEventListener("close", () => { lbImg.removeAttribute("src"); });

// ---------- tags ----------

function setupTags(el, r) {
  const chips = $(".chips", el), input = $(".tag-input", el), box = $(".suggest", el);
  for (const name of r.tags) {
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "chip";
    chip.title = `Remove tag "${name}"`;
    chip.innerHTML = `<span></span><span class="x" aria-hidden="true">×</span>`;
    chip.firstChild.textContent = name;
    chip.onclick = () => act(() => api(`/api/receipts/${r.id}/tags/${encodeURIComponent(name)}`, {method: "DELETE"}));
    chips.append(chip);
  }

  let options = [], active = -1;
  const have = new Set(r.tags.map(t => t.toLowerCase()));

  function show() {
    const q = input.value.trim().toLowerCase();
    const matches = allTags.filter(t => !have.has(t.name.toLowerCase()) && t.name.toLowerCase().includes(q));
    matches.sort((a, b) => (b.name.toLowerCase().startsWith(q) - a.name.toLowerCase().startsWith(q)) || b.count - a.count);
    options = matches.slice(0, 8).map(t => ({name: t.name, label: t.name, count: t.count}));
    const typed = input.value.trim();
    if (typed && !allTags.some(t => t.name.toLowerCase() === typed.toLowerCase()) && !have.has(typed.toLowerCase())) {
      options.push({name: typed, label: `Add new tag "${typed}"`});
    }
    active = q && options.length ? 0 : -1;
    draw();
  }
  function draw() {
    box.replaceChildren(...options.map((o, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = i === active ? "active" : "";
      b.innerHTML = `<span></span><span class="count"></span>`;
      b.firstChild.textContent = o.label;
      b.lastChild.textContent = o.count ? `${o.count}` : "";
      b.onpointerdown = e => e.preventDefault();  // keep focus in the input
      b.onclick = () => add(o.name);
      return b;
    }));
    box.classList.toggle("open", options.length > 0);
  }
  function add(name) {
    name = name.trim();
    if (!name) return;
    if (have.has(name.toLowerCase())) { input.value = ""; return show(); }
    refocusTagFor = r.id;
    act(() => api(`/api/receipts/${r.id}/tags`, {
      method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({name}),
    }));
  }

  input.addEventListener("focus", show);
  input.addEventListener("input", show);
  input.addEventListener("blur", () => box.classList.remove("open"));
  input.addEventListener("keydown", e => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      if (!options.length) return;
      e.preventDefault();
      active = (active + (e.key === "ArrowDown" ? 1 : -1) + options.length) % options.length;
      draw();
    } else if (e.key === "Enter" || e.key === ",") {
      e.preventDefault();
      add(active >= 0 ? options[active].name : input.value);
    } else if (e.key === "Escape") {
      box.classList.remove("open");
    } else if (e.key === "Backspace" && !input.value && r.tags.length) {
      chips.lastChild.click();  // backspace on an empty input removes the last tag
    }
  });
}

async function act(fn, ok = "") {
  msg.textContent = "";
  try { await fn(); msg.textContent = ok; await load(); }
  catch (e) { msg.textContent = e.message; }
}

// ---------- polling, with connection-loss reporting ----------

async function load() {
  clearTimeout(pollTimer);
  let receipts;
  try {
    const r = await fetch("/api/receipts", {signal: AbortSignal.timeout(API_TIMEOUT_MS)});
    if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
    const serverTime = Date.parse(r.headers.get("X-Server-Time"));
    if (!isNaN(serverTime)) clockOffset = serverTime - Date.now();
    receipts = await r.json();
  } catch (e) {
    pollDelay = Math.min(pollDelay * 2, 15000);
    conn.textContent = `Lost connection to the server: ${netError(e).message}. Retrying in ${Math.round(pollDelay / 1000)}s…`;
    conn.classList.add("show");
    pollTimer = setTimeout(load, pollDelay);
    return;
  }
  conn.classList.remove("show");
  pollDelay = 1500;
  try { allTags = await api("/api/tags"); } catch {}  // suggestions are optional; keep the old list on failure
  lastReceipts = receipts;
  render(receipts);
  if (receipts.some(r => r.status === "pending")) pollTimer = setTimeout(load, pollDelay);
}

// ---------- upload ----------

const upload = $("#upload"), uploadLabel = $("#uploadLabel"), bar = $("#bar"), barFill = $("#barFill");
const addBtns = $("#addBtns");
let currentXhr = null, cancelled = false, batchPrefix = "";  // batchPrefix: "Photo 2 of 3 · " for multi-uploads

function showStage(text, fraction = null) {
  upload.classList.add("active");
  uploadLabel.textContent = batchPrefix + text;
  bar.classList.toggle("indeterminate", fraction == null);
  barFill.style.width = fraction == null ? "" : `${Math.round(fraction * 100)}%`;
}

// Re-encode big phone photos to a smaller JPEG before upload. Orientation is baked into the pixels
// (imageOrientation: "from-image"), since the canvas output carries no EXIF.
async function shrink(file) {
  let bmp;
  try { bmp = await createImageBitmap(file, {imageOrientation: "from-image"}); }
  catch { return file; }  // browser can't decode it (e.g. HEIC); let the server try
  const scale = Math.min(1, MAX_UPLOAD_EDGE / Math.max(bmp.width, bmp.height));
  if (scale === 1 && file.size < 1.5e6) return file;
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(bmp.width * scale);
  canvas.height = Math.round(bmp.height * scale);
  canvas.getContext("2d").drawImage(bmp, 0, 0, canvas.width, canvas.height);
  bmp.close?.();
  const blob = await new Promise(res => canvas.toBlob(res, "image/jpeg", 0.85));
  return blob && blob.size < file.size ? blob : file;
}

function send(blob) {
  return new Promise((resolve, reject) => {
    const xhr = currentXhr = new XMLHttpRequest();
    xhr.open("POST", "/api/receipts");
    xhr.timeout = UPLOAD_TIMEOUT_MS;
    xhr.responseType = "json";
    const started = Date.now();
    xhr.upload.onprogress = e => {
      if (!e.lengthComputable) return showStage(`Uploading ${fmtBytes(e.loaded)}…`);
      const secs = Math.round((Date.now() - started) / 1000);
      showStage(`Uploading ${fmtBytes(e.loaded)} of ${fmtBytes(e.total)} · ${fmtSecs(secs)}`, e.loaded / e.total);
    };
    xhr.upload.onload = () => showStage("Uploaded. Cropping and saving on the server…");
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) return resolve(xhr.response);
      reject(new Error(xhr.response?.detail || `server error ${xhr.status}`));
    };
    xhr.onerror = () => reject(new Error("network error: lost connection to the server during upload"));
    xhr.ontimeout = () => reject(new Error(`no response after ${UPLOAD_TIMEOUT_MS / 1000}s (slow network?)`));
    xhr.onabort = () => reject(new Error("cancelled"));
    const fd = new FormData();
    fd.append("file", blob, "receipt.jpg");
    xhr.send(fd);
  });
}

$("#cancelBtn").onclick = () => { cancelled = true; currentXhr?.abort(); };

function isImage(f) { return f.type.startsWith("image/") || /\.(heic|heif)$/i.test(f.name); }

// Upload one or more photos in turn; one failure doesn't stop the rest.
async function uploadFiles(files) {
  const skipped = [...files].filter(f => !isImage(f)).map(f => f.name);
  files = [...files].filter(isImage);
  if (!files.length) { msg.textContent = "That doesn't look like an image."; return; }
  if (addBtns.classList.contains("busy")) { msg.textContent = "Wait for the current upload to finish."; return; }
  addBtns.classList.add("busy");
  msg.textContent = "";
  if (filterActive()) setFilter([], false);  // new receipts are untagged; don't let the filter hide them
  cancelled = false;
  const failures = [];
  let done = 0;
  try {
    for (const [i, file] of files.entries()) {
      if (cancelled) break;
      batchPrefix = files.length > 1 ? `Photo ${i + 1} of ${files.length} · ` : "";
      try {
        showStage(`Preparing ${file.name || "photo"} (${fmtBytes(file.size)})…`);
        const blob = await shrink(file);
        if (cancelled) throw new Error("cancelled");
        await send(blob);
        done++;
        load();  // show it while the rest upload
      } catch (err) {
        if (err.message === "cancelled") break;
        failures.push(`${file.name || "photo"}: ${err.message}`);
      }
    }
  } finally {
    upload.classList.remove("active");
    currentXhr = null;
    batchPrefix = "";
    addBtns.classList.remove("busy");
  }
  const parts = [];
  if (skipped.length) parts.push(`Skipped ${skipped.join(", ")} (not an image).`);
  if (cancelled) parts.push(`Upload cancelled${done ? ` after ${done} photo${done === 1 ? "" : "s"}` : ""}.`);
  if (failures.length) parts.push(`Upload failed for ${failures.join("; ")}`);
  msg.textContent = parts.join(" ");
  await load();
}

for (const input of [$("#cameraInput"), $("#fileInput")]) {
  input.addEventListener("change", e => {
    const files = [...e.target.files];
    e.target.value = "";
    if (files.length) uploadFiles(files);
  });
}

// Drag and drop (desktop)
let dragDepth = 0;
const hasFiles = e => [...(e.dataTransfer?.types || [])].includes("Files");
document.addEventListener("dragenter", e => { if (hasFiles(e)) { dragDepth++; document.body.classList.add("dragging"); } });
document.addEventListener("dragleave", e => { if (hasFiles(e) && --dragDepth <= 0) { dragDepth = 0; document.body.classList.remove("dragging"); } });
document.addEventListener("dragover", e => { if (hasFiles(e)) e.preventDefault(); });
document.addEventListener("drop", e => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  dragDepth = 0;
  document.body.classList.remove("dragging");
  uploadFiles(e.dataTransfer.files);
});

setFilter(filterTags, filterUntagged);  // sync the URL and CSV link with the filter read from the URL
load();
</script>
</body>
</html>
